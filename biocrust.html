<html>

<head>
    <style>
        .word {
            position: absolute;
            color: green;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: burlywood;

        }

        .checkbox-native {
            accent-color: green;
        }

        input[type="checkbox"] {}

        input[type="checkbox"]:checked {
            background-color: green;
        }

        .moss {
            color: yellowgreen;
            position: absolute;
            font-size: 30pt;

        }
    </style>
    </style>
</head>

<body>
    <h1>biocrust</h1>
    <input type="range" min="0" max="100" value="50" step="1" id="x">
    <input type="range" min="0" max="100" value="50" step="1" id="y">
    <input type="range" min="0" max="100" value="50" step="1" id="z">




</body>
<script type="text/javascript">

    let frame = document.getElementById('window');

    let x = 0; //random number for Bird URL


    let text = `another world there 
     seeping
       to partake in 
         this here    
            our sediment     
               at times
                   unknowingly

 there against my
                   outer layers
                   sensorializing
           the presumed edge
                my proprioception
                             unquestions
                               to maintain
                         a semblance
                      of know-how
                   in the midst 
                     of, well,
                        it all

 but maybe it smooths out any wrinkles without me even knowing or seeing

loneliness with no exact locus, isn’t absence either, some kind of insistence on knowing something else. anyway.
`;
    let words = text.split(' ');

    function mossDiv() {
        let moss = document.createElement('div');
        moss.classList.add('moss');
        let x = Math.floor(Math.random() * window.innerWidth);
        let y = Math.floor(Math.random() * window.innerHeight);
        moss.style.left = x + 'px';
        moss.style.top = y + 'px';
        return moss;
    }
    function makeMoss(type) {
        let moss = mossDiv();

        if (type.includes('a')) {
            moss.innerHTML = `###`;
        }
        if (type.includes('f')) {
            moss.innerHTML = `***`;
        } if (type.includes('s')) {
            moss.innerHTML = `\\|//`;

        }
        document.body.append(moss);
    }
    function animateText() {
        console.log(words);
        let y = 0; let x = 0;

        words.forEach(word => {
            if (word.length > 1) {
                let div = document.createElement('div');
                div.classList.add('word')
                let x = Math.floor(Math.random() * window.innerWidth);
                y += window.innerHeight / words.length * 5;

                div.style.left = x + 'px';
                div.style.top = y + 'px';
                // div.innerHTML = `<input type="checkbox"></input> ` + word;

                div.innerHTML = word;
                document.body.append(div);
                makeMoss(word);


            }
        });
    }



    animateText();
</script>


</html>
