<html>

<head>
    <style>
        .word,
        .moss,
        .underground {
            transition: all 1s ease;
            user-select: none;

        }

        .word {
            position: absolute;
            color: #9acd32;
            font-size: 20px;
            letter-spacing: 4px;
            font-weight: bold;
            font-family: 'Times', Arial, Helvetica, sans-serif;
            z-index: 0;
            padding: 10px;
            animation: 20s sleep 10s infinite alternate;
            text-align: center;
            -webkit-text-stroke: 5px rgb(53, 39, 21);
            paint-order: stroke fill;
            opacity: 1;


        }


        .underground {
            opacity: 0 !important;

        }

        text {
            fill: #352715;
            font-size: 4px;
            letter-spacing: 1px;
            user-select: none;
            font-family: monospace;
            z-index: 0;

        }

        .word:hover {
            font-size: 12px !important;
            transition: all 1s ease;
        }



        @keyframes mossGrow {
            from {
                transform: scale(100%);
            }

            to {
                transform: scale(150%);
            }
        }

        @keyframes sleep {
            from {
                translate: -10px 0px;
            }

            to {
                translate: 10px 0px;

            }
        }

        body {
            background-color: burlywood;
            background-image: url('crust.png');
            background-size: cover;
            overflow-y: hidden;
        }


        .moss {
            width: 60px;
            height: 60px;
            opacity: 0.75;
            background-size: contain;
            position: absolute;
            background-repeat: no-repeat;
            z-index: -1;
            mix-blend-mode: exclusion;
            text-align: center;
            animation: 10s mossGrow alternate infinite;

        }

        #elements {
            color: white;
            display: flex;
            width: 300px;
            height: 40px;
            flex-flow: row nowrap;
            align-items: center;

        }

        span {
            margin: 0px 15px;
            font-family: monospace;

        }

        h1 {
            line-height: 10px;
            font-family: times;
            margin-right: 20px;

        }



        #big-light {
            height: 50px;
            width: 600px;
            position: absolute;
            top: -50px;
            right: -300px;
            background-color: white;
            border-radius: 100%;
            margin: 20px;
            filter: blur(30px);
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <section id="elements">
        <h1>biocrust</h1>

        <span>wind </span><input type="range" min="1" max="10" value="5" step="1" id="x">
        <span>water </span> <input type="range" min="40" max="100" value="60" step="1" id="y">
        <span>sun </span> <input type="range" min="-25" max="25" value="0" step="0.1" id="z">
        <div id="big-light">the sun</div>

<script type="text/javascript">

    let frameInterval = 1000; // ~33.33ms
    let lastRender = 0;

    let mosses = ["1.png", "2.png", "3.png", "4.png", "5.png", "6.png", "7.png", "8.png"];
    let wind = document.getElementById('x');
    let water = document.getElementById('y');
    let sun = document.getElementById('z');
    let frame = document.getElementById('window');

    let offset = 30;

    wind.addEventListener("input", (event) => {
        changeWind(event.target.value);
        console.log(frameInterval)
    });
    water.addEventListener("input", (event) => {
        changeWater(event.target.value);
    });
    sun.addEventListener("input", (event) => {
        changeSun(event.target.value);

    });


    let text = `another world there 
     seeping
       to partake in 
         this here    
            our sediment     
               at times
                   unknowingly
 there against my
outer layers
                   sensorializing
           the presumed edge
                my proprioception
                             unquestions
                               to maintain
                         a semblance
                      of know-how
                   in the midst 
                     of, well,
                        it all
 but maybe it smooths out any wrinkles without me even knowing or seeing
loneliness with no exact locus, isn’t absence either, some kind of insistence on knowing something else. anyway.
The author of milkweed is milkweed, the writer of the pink flower. 
the soil an inkwell
“HTML is pronounced hache tee em elle, do not say hittamel”   
hittite clay dictionary (how did we get here/)
i’d like to reboot not to update; close all windows, choose not to save. 
file > open > remember this?
without a visible marker of distance, this text extends, smoothing over (perhaps) it’s sporadicity.
spore seeds 
stars diatribing their light across the distance, beautiful, bliss-ridden.
meanwhile, a diatom and plankton becoming friends
oooh the heart a storm. friends around each with a weight weighing. how to be in some small measure an upward force alongside their straining.

adore the typo as an invitation. oh and yes i abhor it when it disrupts my ghosted sheen of “rightness”
a desire for wrongness until it’s, well, here.`;


    let words = text.split(' ');
    function scale(number, inMin, inMax, outMin, outMax) {
        return (number - inMin) * (outMax - outMin) / (inMax - inMin) + outMin;
    }
    function changeWind(value) {
        frameInterval = 1000 / value;
        let words = document.querySelectorAll('.word');
        words.forEach(word => {
            word.style.animationDuration = 20 / value + "s";
        });

    }
    function changeSun(value) {
        let words = document.querySelectorAll('.word');
        let sunDiv = document.getElementById('big-light');
        console.log(sunDiv);
        words.forEach(word => {
            word.style.setProperty('letter-spacing', Math.abs(value) / 4 + 'px');
            // word.style.setProperty('translate', '-' + value / 2 + 'px 0px');
            word.style.setProperty('transform', 'skew(' + value * -1 + 'deg)');
        });
        sunDiv.style.left = scale(value, -25, 25, -300, window.innerWidth - 300) + "px";

    }
    function changeWater(value) {
        let mossDivs = document.querySelectorAll('.moss');
        let words = document.querySelectorAll('.word');

        mossDivs.forEach(moss => {
            moss.style.width = value + 'px';
            moss.style.height = value + 'px';
            moss.style.translate = '-' + value / 2 + 'px ' + '-' + value / 2 + 'px';

        })
        words.forEach(word => {
            word.style.fontSize = value / 2 + 'px';
        })

    }





    function mossDiv() {
        let moss = document.createElement('img');
        let w = Math.floor(Math.random() * 50) + 30;
        moss.classList.add('moss');
        moss.classList.add('underground');

        moss.style.width = w + 'px';
        moss.style.height = w + 'px';
        let m = Math.floor(Math.random() * mosses.length);
        moss.src = 'mosses/' + mosses[m];
        return moss;
    }
    function makeMoss(x, y) {
        let moss = mossDiv();
        moss.style.left = x + 'px';
        moss.style.top = y + offset + 'px';
        document.body.append(moss);
    }
    function makeText() {
        let y = 0;

        words.forEach(word => {
            if (word.length > 1) {
                let div = document.createElement('div');
                div.classList.add('word');
                div.classList.add('underground');

                let x = Math.floor(Math.random() * window.innerWidth);
                y += window.innerHeight / words.length * 5;
                div.style.left = x + 'px';
                div.style.top = y + offset + 'px';
                div.innerHTML = word;
                let s = Math.floor(Math.random() * 10);
                div.style.animationDelay = s + "s";
                document.body.append(div);
                if (word.includes('m') || word.includes('o') || word.includes('s')) {
                    makeMoss(x, y);
                }
            }
        });


    }

    function animateText(timestamp) {
        const elapsed = timestamp - lastRender;
        if (elapsed >= frameInterval) {
            lastRender = timestamp - (elapsed % frameInterval);

            let words = document.querySelectorAll('.word');
            let mosses = document.querySelectorAll('.moss');

            let r = Math.floor(Math.random() * words.length);
            let m = Math.floor(Math.random() * mosses.length);


            words[r].classList.toggle('underground');
            mosses[m].classList.toggle('underground');

        }

        requestAnimationFrame(animateText);

    }



    makeText();
    requestAnimationFrame(animateText);

</script>
