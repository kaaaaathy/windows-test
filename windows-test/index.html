<html>

<head>
    <style>
        #window {
            width: 250px;
            height: 300px;
            /* width: 100%;
            height: 100%; */
            background-color: dimgrey;
            transform: scale(3);

        }

        #clip {
            width: 250px;
            height: 300px;
            position: absolute;
            right: 20%;
            top: 5%;
            /* width: 100%;
            height: 100%; */

            overflow: hidden;

        }

        body {
            font-family: 'inconsolata';
            font-size: 10px;
            color: black;
        }

        .word {
            padding: 12px;
            text-align: center;
            align-items: center;
            font-size: 15px;

            /* animation: 100s fly forwards infinite ease; */
        }

        #container {
            display: flex;
            flex-flow: row wrap;
            position: absolute;
            width: 58%;
            height: 58%;
            overflow-y: hidden;
            top: 0px;
            right: 0;
            background: transparent;
            /* z-index: -100; */
            /* display: none; */

        }

        #x,
        #y,
        #z {
            position: absolute;


        }

        #x {
            top: 60%;
            left: 40%;
            width: 60%;

        }

        #y {
            transform: rotate(90deg);
            transform-origin: 0%;
            top: 0px;
            left: 40%;
            width: 30%;


        }

        #z {
            transform: rotate(-30deg);
            transform-origin: 100%;
            top: 60%;
            left: 0%;
            width: 40%;




        }

        @keyframes fly {
            0% {
                translate: 0px 0px;
            }

            100% {
                translate: 500px 0px;
            }
        }
    </style>
</head>

<body>
    <h1>I AM A WINDOW NOT A DOOR</h1>
    <button onclick="nextBird()">fly away</button>
    <input type="range" min="0" max="100" value="50" step="1" id="x">
    <input type="range" min="0" max="100" value="50" step="1" id="y">
    <input type="range" min="0" max="100" value="50" step="1" id="z">


    <div id="clip">
        <iframe id="window"
            src="https://www.google.com/maps/embed?pb=!4v1791241612447!6m8!1m7!1sSDoAf6m1PNSfGecN4IxfoA!2m2!1d17.04745264319362!2d54.06243878279867!3f101.68!4f-9.239999999999995!5f1.263140187226782"
            width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>

    </div>
    <div id="container"></div>


</body>
<script type="text/javascript">

    let frame = document.getElementById('window');

    let birdURLs = [];
    let birdNames = [];
    let x = 0; //random number for Bird URL
    async function fetchBirds() {
        try {
            const response = await fetch("./birds.json");
            if (!response.ok) {
                throw new Error(`HTTP error: ${response.status}`);
            }

            let allBirds = await response.json();
            allBirds.forEach(bird => {
                if (bird.url) {
                    birdURLs.push(bird.url);
                }
                if (bird.species != "") {
                    birdNames.push(bird.species);
                }
            });
            console.log(birdURLs[0]);
            console.log(birdNames[0]);
            // console.log(birdURLs, birdNames);
            nextBird();


        } catch (error) {
            console.error("Could not fetch birds:", error);
        }
    }

    let text = `another world there 
     seeping
       to partake in 
         this here    
            our sediment     
               at times
                   unknowingly

 there against my
                   outer layers
                   sensorializing
           the presumed edge
                my proprioception
                             unquestions
                               to maintain
                         a semblance
                      of know-how
                   in the midst 
                     of, well,
                        it all

 but maybe it smooths out any wrinkles without me even knowing or seeing

loneliness with no exact locus, isn’t absence either, some kind of insistence on knowing something else. anyway.
`;
    let words = text.split(' ');
    let wordContainer = document.getElementById('container');

    function animateText() {
        console.log(words);
        let y = 0; let x = 0;

        words.forEach(word => {
            if (word.length > 1) {
                let div = document.createElement('div');
                div.classList.add('word')
                // let x = Math.floor(Math.random() * window.innerWidth);
                y += window.innerHeight / words.length * 5;
                x += window.innerWidth / words.length * 5;

                // div.style.left = x + 'px';
                // div.style.top = y + 'px';
                div.innerHTML = `<input type="checkbox"></input> ` + word;
                wordContainer.append(div);

            }
        });
    }

    function nextBird() {
        x = Math.floor(Math.random() * 4)

        frame.src = birdURLs[x];


    }

    fetchBirds();

    animateText();
</script>


</html>
